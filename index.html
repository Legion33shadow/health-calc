<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Health Calculators — BMI, Calories (TDEE), Macros</title>
<meta name="description" content="Free BMI, daily calorie (TDEE, Mifflin-St Jeor) and macro calculators. Standard formulas. Not medical advice.">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh}.hero{text-align:center;padding:56px 20px 36px;background:linear-gradient(180deg,#1a0a0a,#0a0a0a)}.hero h1{font-size:clamp(24px,4vw,42px);font-weight:700;color:#ef4444;margin-bottom:10px}.hero p{color:#777;font-size:15px}.tabs{display:flex;max-width:560px;margin:0 auto;padding:0 20px}.tab{flex:1;font-size:14px;padding:12px;border:1px solid #222;background:#111;color:#888;cursor:pointer;text-align:center}.tab.on{background:#ef4444;color:#fff;border-color:#ef4444}.wrap{max-width:560px;margin:20px auto;padding:0 20px 60px}.cb{display:none}.cb.on{display:block}.panel{background:#111;border:1px solid #1e1e1e;border-radius:14px;padding:24px}.lbl{font-size:12px;color:#888;margin-bottom:5px;display:block;text-transform:uppercase}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;background:#0a0a0a;border:1px solid #222;border-radius:8px;color:#f0f0f0;font-size:14px;padding:10px;margin-bottom:12px;outline:none}.btn{width:100%;background:#ef4444;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer}.res{margin-top:18px;background:#0a0a0a;border:1px solid #1e1e1e;border-radius:10px;padding:18px;display:none;text-align:center}.rv{font-size:40px;font-weight:700;color:#ef4444;margin-bottom:6px}.rc{font-size:13px;color:#888;margin-bottom:10px}.rt{font-size:13px;color:#aaa;line-height:1.7;text-align:left;white-space:pre-line}.ft{text-align:center;padding:24px;color:#555;font-size:12px}</style>
</head><body>
<div class="hero"><h1>Health Calculators</h1><p>BMI &middot; Calories (TDEE) &middot; Macros — standard formulas</p></div>
<div class="tabs">
<div class="tab on" onclick="show('bmi',this)">BMI</div>
<div class="tab" onclick="show('cal',this)">Calories</div>
<div class="tab" onclick="show('macro',this)">Macros</div>
</div>
<div class="wrap">
<div class="cb on" id="bmi"><div class="panel">
<div class="row"><div><label class="lbl">Weight (kg)</label><input id="bw" type="number" placeholder="70"></div><div><label class="lbl">Height (cm)</label><input id="bh" type="number" placeholder="175"></div></div>
<button class="btn" onclick="calcBMI()">Calculate BMI</button>
<div class="res" id="bmi-r"><div class="rv" id="bmi-v">-</div><div class="rc" id="bmi-c">-</div><div class="rt" id="bmi-t"></div></div>
</div></div>
<div class="cb" id="cal"><div class="panel">
<div class="row"><div><label class="lbl">Weight (kg)</label><input id="cw" type="number" placeholder="75"></div><div><label class="lbl">Height (cm)</label><input id="ch" type="number" placeholder="175"></div></div>
<div class="row"><div><label class="lbl">Age</label><input id="cage" type="number" placeholder="30"></div><div><label class="lbl">Sex</label><select id="csex"><option value="m">Male</option><option value="f">Female</option></select></div></div>
<label class="lbl">Activity</label><select id="act"><option value="1.2">Sedentary</option><option value="1.375">Light (1-3x/wk)</option><option value="1.55" selected>Moderate (3-5x/wk)</option><option value="1.725">Active (6-7x/wk)</option></select>
<button class="btn" onclick="calcCal()">Calculate Calories</button>
<div class="res" id="cal-r"><div class="rv" id="cal-v">-</div><div class="rc">Daily calories (TDEE)</div><div class="rt" id="cal-t"></div></div>
</div></div>
<div class="cb" id="macro"><div class="panel">
<div class="row"><div><label class="lbl">Daily calories</label><input id="mc" type="number" placeholder="2200"></div><div><label class="lbl">Split</label><select id="mg"><option value="0.3,0.4,0.3">Balanced</option><option value="0.4,0.3,0.3">High protein</option><option value="0.25,0.5,0.25">High carb</option></select></div></div>
<button class="btn" onclick="calcMacro()">Calculate Macros</button>
<div class="res" id="macro-r"><div class="rv" id="macro-v">-</div><div class="rc">Daily macros</div><div class="rt" id="macro-t"></div></div>
</div></div>
</div>
<div class="ft">Standard formulas (BMI, Mifflin-St Jeor TDEE, macro split). Not medical advice — consult a professional.</div>
<script>
function show(id,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');document.querySelectorAll('.cb').forEach(c=>c.classList.remove('on'));document.getElementById(id).classList.add('on');}
function calcBMI(){var w=+document.getElementById('bw').value,h=+document.getElementById('bh').value/100;if(!w||!h)return;var bmi=w/(h*h),cat;if(bmi<18.5)cat='Underweight';else if(bmi<25)cat='Normal weight';else if(bmi<30)cat='Overweight';else cat='Obese';document.getElementById('bmi-v').textContent=bmi.toFixed(1);document.getElementById('bmi-c').textContent=cat;document.getElementById('bmi-t').textContent='BMI = weight / height squared. One indicator among many; consult a professional for health decisions.';document.getElementById('bmi-r').style.display='block';}
function calcCal(){var w=+document.getElementById('cw').value||75,h=+document.getElementById('ch').value||175,age=+document.getElementById('cage').value||30,sex=document.getElementById('csex').value,act=+document.getElementById('act').value||1.55;var bmr=sex==='m'?10*w+6.25*h-5*age+5:10*w+6.25*h-5*age-161;var tdee=Math.round(bmr*act);document.getElementById('cal-v').textContent=tdee.toLocaleString();document.getElementById('cal-t').textContent='Maintenance: '+tdee+' kcal/day\nLoss (-0.5kg/wk): '+(tdee-500)+' kcal/day\nGain (+0.5kg/wk): '+(tdee+300)+' kcal/day\nBMR: '+Math.round(bmr)+' kcal/day';document.getElementById('cal-r').style.display='block';}
function calcMacro(){var cal=+document.getElementById('mc').value||2200,parts=document.getElementById('mg').value.split(',').map(Number),p=parts[0],c=parts[1],f=parts[2];var prot=Math.round(cal*p/4),carb=Math.round(cal*c/4),fat=Math.round(cal*f/9);document.getElementById('macro-v').textContent=cal.toLocaleString();document.getElementById('macro-t').textContent='Protein: '+prot+'g\nCarbs: '+carb+'g\nFat: '+fat+'g';document.getElementById('macro-r').style.display='block';}
</script>
</body></html>
